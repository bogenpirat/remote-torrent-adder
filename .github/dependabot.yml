version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: quarterly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: quarterly
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
