name: Build Extension

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# Queue runs per ref rather than cancelling them, so every pushed commit keeps
# its own result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
      - name: Audit dependencies
        run: pnpm audit

  build-dev:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Chrome extension
        run: pnpm bundle
      - name: Build Firefox extension
        run: pnpm bundle --browser=firefox
      - name: Lint the Firefox bundle
        run: pnpm lint:firefox
      - name: Build the self-hosted Firefox extension
        run: pnpm bundle --browser=firefox --prod && node scripts/build-unlisted.ts
      - name: Lint the self-hosted Firefox bundle
        run: pnpm exec web-ext lint --source-dir dist-prod/firefox-unlisted --self-hosted
      - name: Upload Chrome build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist
          path: dist/chrome
      - name: Upload Firefox build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension-dist
          path: dist/firefox

  e2e:
    # Launching a real browser is slow and flakier than the unit suite, so it
    # guards master rather than every push.
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the built Chrome extension
        uses: actions/download-artifact@v8
        with:
          name: chrome-extension-dist
          path: dist/chrome
      - name: Download the built Firefox extension
        uses: actions/download-artifact@v8
        with:
          name: firefox-extension-dist
          path: dist/firefox
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Firefox
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          MOZ_HEADLESS: '1'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  integration:
    needs: build-dev
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the built Chrome extension
        uses: actions/download-artifact@v8
        with:
          name: chrome-extension-dist
          path: dist/chrome
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Run integration tests
        run: pnpm test:it
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-it
          path: playwright-report/it
          retention-days: 7

  build-prod:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Chrome extension (production)
        run: pnpm bundle --prod
      - name: Build Firefox extension (production)
        run: pnpm bundle --browser=firefox --prod
      - name: Upload Chrome production build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist-prod
          path: dist-prod/chrome
      - name: Upload Firefox production build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension-dist-prod
          path: dist-prod/firefox
