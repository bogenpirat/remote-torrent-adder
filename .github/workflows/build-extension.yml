name: Build Extension

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

# Queue runs per ref rather than cancelling them, so every pushed commit keeps
# its own result.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
      # npm audit --audit-level=high, minus a reviewed allowlist for advisories
      # that have no fixed release upstream. See scripts/audit.mjs.
      - name: Audit dependencies
        run: npm run audit

  build-dev:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Chrome extension
        run: npm run build:run
      - name: Build Firefox extension
        run: npm run build:firefox:run
      # AMO's own linter. It runs in seconds and catches manifest mistakes long
      # before a rejected submission would.
      - name: Lint the Firefox bundle
        run: npm run lint:firefox
      - name: Upload Chrome build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist
          path: dist/chrome
      - name: Upload Firefox build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension-dist
          path: dist/firefox

  e2e:
    # Launching a real browser is slow and flakier than the unit suite, so it
    # guards master rather than every push.
    if: github.ref == 'refs/heads/master'
    needs: build-dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Download the built Chrome extension
        uses: actions/download-artifact@v8
        with:
          name: chrome-extension-dist
          path: dist/chrome
      - name: Download the built Firefox extension
        uses: actions/download-artifact@v8
        with:
          name: firefox-extension-dist
          path: dist/firefox
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # The Firefox project drives a real Firefox through geckodriver, not
      # Playwright's bundled build. Selenium Manager fetches geckodriver itself.
      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1
      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          MOZ_HEADLESS: '1'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build-prod:
    if: github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Chrome extension (production)
        run: npm run build:prod:run
      - name: Build Firefox extension (production)
        run: npm run build:firefox:prod:run
      - name: Upload Chrome production build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension-dist-prod
          path: dist-prod/chrome
      - name: Upload Firefox production build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firefox-extension-dist-prod
          path: dist-prod/firefox
