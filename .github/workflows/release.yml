name: Release

# Manual, version-driven release.
#
# Trigger from the Actions tab (or: gh workflow run Release -f version=2.0.6),
# supplying the version. The workflow bumps the version in source, builds the
# Chrome and Firefox bundles in both dev and prod flavours, then commits + tags
# THAT commit so the tag always lands on the commit carrying the version.
# Finally it publishes a GitHub Release with all four bundles attached and
# uploads the Chrome prod bundle to the Chrome Web Store.
#
# The addons.mozilla.org upload is written out below but commented out until the
# AMO listing exists; see the block at the end of this file.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#     obtained by enabling the Chrome Web Store API in a Google Cloud project
#     and minting an OAuth refresh token.
#   RELEASE_TOKEN
#     a fine-grained PAT with Contents: read & write, owned by someone with a
#     bypass entry in the master ruleset, so the bump-commit + tag can be pushed.
#   AMO_JWT_ISSUER, AMO_JWT_SECRET  (not needed yet - see the commented block)
#     from addons.mozilla.org -> Tools -> Manage API Keys.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 2.0.6 (a v-prefix is accepted)'
        required: true
        type: string

# contents: write is needed to push the bump commit + tag and create the release.
permissions:
  contents: write

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          # PAT (not GITHUB_TOKEN) so the bump-commit + tag push can bypass the
          # branch ruleset on master. The token's owner must have a bypass entry
          # (e.g. the "Repository admin" role) in that ruleset.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Normalize and validate version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$RAW_VERSION' (expected x.y.z or vx.y.z)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — pick a new version." >&2
            exit 1
          fi

      - name: Apply version to source files
        run: node scripts/bump-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      # Build every bundle BEFORE moving any git refs, so a build failure aborts
      # the release without leaving a dangling commit or tag behind. build:all
      # runs the typecheck/lint/test gate once for all four.
      - name: Build all bundles
        run: npm run build:all

      # AMO's own linter, as a last gate before the Firefox bundle is published.
      - name: Lint the Firefox bundle
        run: npm run lint:firefox

      - name: Zip bundles
        run: |
          V="${{ steps.ver.outputs.version }}"
          (cd dist/chrome && zip -qr "../../remote-torrent-adder-$V-dev.zip" .)
          (cd dist-prod/chrome && zip -qr "../../remote-torrent-adder-$V-prod.zip" .)
          (cd dist/firefox && zip -qr "../../remote-torrent-adder-$V-firefox-dev.zip" .)
          (cd dist-prod/firefox && zip -qr "../../remote-torrent-adder-$V-firefox-prod.zip" .)

      - name: Commit, tag and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/manifest.json package.json package-lock.json
          git commit -m "chore: release ${{ steps.ver.outputs.tag }} [skip ci]"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:master
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            remote-torrent-adder-${{ steps.ver.outputs.version }}-dev.zip
            remote-torrent-adder-${{ steps.ver.outputs.version }}-prod.zip
            remote-torrent-adder-${{ steps.ver.outputs.version }}-firefox-dev.zip
            remote-torrent-adder-${{ steps.ver.outputs.version }}-firefox-prod.zip

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: remote-torrent-adder-${{ steps.ver.outputs.version }}-prod.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          # AUTO-PUBLISH TOGGLE
          #   publish: true  -> upload AND submit for review/publication automatically.
          #   publish: false -> upload only; the new version sits as a draft and
          #                     you click "Publish" in the dashboard.
          publish: true

      # ----------------------------------------------------------------------
      # addons.mozilla.org
      # ----------------------------------------------------------------------
      # Commented out until the AMO listing exists. `web-ext sign` cannot CREATE
      # a listing: the first submission has to be done by hand on AMO, which is
      # what claims browser_specific_settings.gecko.id and fills in the store
      # metadata. Upload remote-torrent-adder-<version>-firefox-prod.zip from
      # the GitHub Release for that first submission, then uncomment both steps
      # below and add the AMO_JWT_ISSUER / AMO_JWT_SECRET secrets.
      #
      # AMO requires the source alongside any minified upload, which the prod
      # build is. `git archive HEAD` MUST run after the bump commit or it ships a
      # source zip whose version does not match the bundle. README.md carries the
      # build instructions the reviewer needs and is included by the archive.
      #
      # web-ext is called directly rather than through a third-party action: it
      # is Mozilla's own CLI, it is already a devDependency for lint:firefox, and
      # this workflow holds store-publishing credentials.

      # - name: Package source for AMO review
      #   run: git archive --format=zip -o "remote-torrent-adder-${{ steps.ver.outputs.version }}-source.zip" HEAD
      #
      # - name: Upload to addons.mozilla.org
      #   env:
      #     WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      #     WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      #   run: >
      #     npx web-ext sign
      #     --source-dir dist-prod/firefox
      #     --channel listed
      #     --upload-source-code "remote-torrent-adder-${{ steps.ver.outputs.version }}-source.zip"
      #     --artifacts-dir web-ext-artifacts
