name: Release

# Manual, version-driven release.
#
# Trigger from the Actions tab (or: gh workflow run Release -f version=2.0.6),
# supplying the version. The workflow bumps the version in source, builds the
# Chrome and Firefox bundles in both dev and prod flavours, and gets the
# self-hosted Firefox bundle signed by AMO's unlisted channel, which returns an
# installable .xpi in about a minute. That signing is best effort: if it fails
# the release still ships, just without the .xpi. It then commits + tags THAT
# commit so the tag always lands on the commit carrying the version, publishes a
# GitHub Release with the four bundles plus the .xpi attached, uploads the
# Chrome prod bundle to the Chrome Web Store and submits the Firefox bundle to
# AMO's listed channel.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#     obtained by enabling the Chrome Web Store API in a Google Cloud project
#     and minting an OAuth refresh token.
#   RELEASE_TOKEN
#     a fine-grained PAT with Contents: read & write, owned by someone with a
#     bypass entry in the master ruleset, so the bump-commit + tag can be pushed.
#   AMO_JWT_ISSUER, AMO_JWT_SECRET
#     from addons.mozilla.org -> Tools -> Manage API Keys.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 2.0.6 (a v-prefix is accepted)'
        required: true
        type: string

# contents: write is needed to push the bump commit + tag and create the release.
permissions:
  contents: write

# Never run two releases at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v7
        with:
          ref: master
          # PAT (not GITHUB_TOKEN) so the bump-commit + tag push can bypass the
          # branch ruleset on master. The token's owner must have a bypass entry
          # (e.g. the "Repository admin" role) in that ruleset.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Normalize and validate version
        id: ver
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version '$RAW_VERSION' (expected x.y.z or vx.y.z)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.ver.outputs.tag }} already exists — pick a new version." >&2
            exit 1
          fi

      - name: Apply version to source files
        run: node scripts/bump-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Install dependencies
        run: npm ci

      # Build every bundle BEFORE moving any git refs, so a build failure aborts
      # the release without leaving a dangling commit or tag behind.
      - name: Build all bundles
        run: npm run build:all

      - name: Lint the Firefox bundle
        run: npm run lint:firefox

      - name: Lint the self-hosted Firefox bundle
        run: npm run lint:firefox:unlisted

      - name: Sign the unlisted Firefox bundle
        id: sign_unlisted
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npx web-ext sign --source-dir dist-prod/firefox-unlisted --channel unlisted --approval-timeout 600000 --artifacts-dir web-ext-artifacts-unlisted
          XPI="$(find web-ext-artifacts-unlisted -maxdepth 1 -name '*.xpi' -print -quit)"
          [ -n "$XPI" ] || { echo 'web-ext produced no .xpi' >&2; exit 1; }
          mv "$XPI" "remote-torrent-adder-$VERSION.xpi"

      - name: Report the signing outcome
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.sign_unlisted.outcome }}
        run: |
          if [ "$SIGNED" = 'success' ]; then
            echo "Signed remote-torrent-adder-$VERSION.xpi will be attached to the release." >> "$GITHUB_STEP_SUMMARY"
            {
              echo '### Firefox'
              echo
              echo "Download **remote-torrent-adder-$VERSION.xpi** below, then install it"
              echo 'from about:addons -> the gear icon -> **Install Add-on From File**.'
              echo 'It updates itself from this repository.'
            } > release-body.md
          else
            echo 'Unlisted signing failed - this release ships without a .xpi.' >> "$GITHUB_STEP_SUMMARY"
            echo > release-body.md
          fi

      - name: Write the self-hosted update manifest
        if: steps.sign_unlisted.outcome == 'success'
        run: node scripts/generate-update-manifest.mjs "${{ steps.ver.outputs.version }}"

      - name: Zip bundles
        run: |
          V="${{ steps.ver.outputs.version }}"
          (cd dist/chrome && zip -qr "../../remote-torrent-adder-$V-dev.zip" .)
          (cd dist-prod/chrome && zip -qr "../../remote-torrent-adder-$V-prod.zip" .)
          (cd dist/firefox && zip -qr "../../remote-torrent-adder-$V-firefox-dev.zip" .)
          (cd dist-prod/firefox && zip -qr "../../remote-torrent-adder-$V-firefox-prod.zip" .)

      - name: Commit, tag and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/manifest.json package.json package-lock.json updates.json
          git commit -m "chore: release ${{ steps.ver.outputs.tag }} [skip ci]"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin HEAD:master
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Package source for AMO review
        run: >
          git -c core.autocrlf=false archive --format=zip
          -o "remote-torrent-adder-${{ steps.ver.outputs.version }}-source.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body_path: release-body.md
          fail_on_unmatched_files: false
          preserve_order: true
          files: |
            remote-torrent-adder-${{ steps.ver.outputs.version }}-prod.zip
            remote-torrent-adder-${{ steps.ver.outputs.version }}.xpi
            remote-torrent-adder-${{ steps.ver.outputs.version }}-firefox-prod.zip
            remote-torrent-adder-${{ steps.ver.outputs.version }}-dev.zip
            remote-torrent-adder-${{ steps.ver.outputs.version }}-firefox-dev.zip

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6.0.0
        with:
          file-path: remote-torrent-adder-${{ steps.ver.outputs.version }}-prod.zip
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          # AUTO-PUBLISH TOGGLE
          #   publish: true  -> upload AND submit for review/publication automatically.
          #   publish: false -> upload only; the new version sits as a draft and
          #                     you click "Publish" in the dashboard.
          publish: true

      - name: Upload to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: >
          npx web-ext sign
          --source-dir dist-prod/firefox
          --channel listed
          --upload-source-code "remote-torrent-adder-${{ steps.ver.outputs.version }}-source.zip"
          --artifacts-dir web-ext-artifacts
